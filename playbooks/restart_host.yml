---
# Restart a simulated host, through the fleet-sim Sim API v1 action `restart`. One of the playbooks an AI
# advisor may suggest; a person approves before it runs. Everything it touches is simulated.
#
# Variables: fleetsim_api_url, fleetsim_api_token (credential), target_host (required);
# fleetsim_reason, fleetsim_approval, fleetsim_action_timeout_seconds (300), fleetsim_validate_certs (true).
- name: Restart a simulated host
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    sim_action: restart
    fleetsim_reason: "suggested by the AI advisor, approved by a person"
  tasks:
    - name: Check the target and run the action
      ansible.builtin.import_tasks: tasks/single_action.yml
