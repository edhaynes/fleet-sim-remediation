---
# Repair simulated hosts that a policy found not ready, through the fleet-sim Sim API v1.
# Designed to be launched by Red Hat ACM PolicyAutomation (which passes target_clusters), or by
# hand. Everything it touches is simulated; it changes no real systems.
#
# Variables:
#   fleetsim_api_url      Sim API base URL (required)
#   fleetsim_api_token    bearer token for writes (required; supply it as an AAP credential)
#   target_clusters       cluster ids to repair (ACM passes the violating clusters)
#   fleetsim_remediation  runbook (default): repair each host with the action that fits its status;
#                         ai: hand each cluster's incident to a fleet-sim AI advisor, which suggests
#                         a playbook for a person to approve; nothing is repaired here
#   fleetsim_advisor_url  the advisor's base URL (required for ai; it accepts the same token)
#   fleetsim_action_timeout_seconds   how long to wait for each repair (default 300)
#   fleetsim_validate_certs           verify TLS (default true)
- name: Repair simulated hosts that are not ready
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_clusters: []
    fleetsim_remediation: runbook
    fleetsim_action_timeout_seconds: 300
    fleetsim_validate_certs: true
    fleetsim_requested_by: "AAP job {{ awx_job_id | default(tower_job_id | default('local run')) }}"
    fleetsim_reason: "policy {{ policy_name | default('unknown') }} reported the cluster non-compliant"
  tasks:
    - name: Check the inputs
      ansible.builtin.assert:
        that:
          - fleetsim_api_url is defined and fleetsim_api_url | length > 0
          - fleetsim_api_token is defined and fleetsim_api_token | length > 0
          - target_clusters | length > 0
          - fleetsim_remediation in ['runbook', 'ai']
          - fleetsim_remediation != 'ai' or (fleetsim_advisor_url | default('') | length > 0)
        fail_msg: >-
          Set fleetsim_api_url, fleetsim_api_token (credential) and target_clusters;
          fleetsim_remediation is runbook or ai, and ai needs fleetsim_advisor_url.
        quiet: true

    - name: Read which repair actions the simulator offers
      ansible.builtin.uri:
        url: "{{ fleetsim_api_url }}/v1/simulator"
        validate_certs: "{{ fleetsim_validate_certs }}"
      register: simulator

    - name: List the hosts of each target cluster
      ansible.builtin.uri:
        url: "{{ fleetsim_api_url }}/v1/hosts?cluster={{ item | urlencode }}"
        validate_certs: "{{ fleetsim_validate_certs }}"
      loop: "{{ target_clusters }}"
      register: cluster_hosts

    # Host actions only: a cluster-scope action (Sim API 1.2.0) needs a person or the AI to choose it.
    # By id, since a simulator before 1.2.0 sends no scope at all.
    - name: Find the cluster-scope actions
      ansible.builtin.set_fact:
        cluster_actions: >-
          {{ simulator.json.actions | selectattr('scope', 'defined') | selectattr('scope', 'equalto', 'cluster')
             | map(attribute='id') | list }}

    - name: Pick the hosts that are not ready, and a host action that applies to each
      ansible.builtin.set_fact:
        repairs: >-
          {{ repairs | default([]) + [{'host': host.id, 'status': host.status,
              'action': (simulator.json.actions | rejectattr('id', 'in', cluster_actions)
                         | selectattr('applies_to', 'contains', host.status)
                         | map(attribute='id') | first | default(''))}] }}
      loop: "{{ cluster_hosts.results | map(attribute='json') | flatten | rejectattr('ready') | list }}"
      loop_control:
        loop_var: host
        label: "{{ host.id }} ({{ host.status }})"

    - name: Report what will be repaired
      ansible.builtin.debug:
        msg: "{{ repairs | default([]) | map(attribute='host') | list or 'nothing to repair: every host is ready' }}"

    - name: Hand each incident to the AI advisor
      when: fleetsim_remediation == 'ai'
      block:
        - name: Post the incident
          ansible.builtin.uri:
            url: "{{ fleetsim_advisor_url }}/v1/incidents"
            method: POST
            status_code: 202
            body_format: json
            body:
              cluster: "{{ item.item }}"
              hosts: "{{ item.json | rejectattr('ready') | map(attribute='id') | list }}"
              policy: "{{ policy_name | default('') }}"
              aap_job_id: "{{ awx_job_id | default(tower_job_id | default('')) | string }}"
            headers:
              Authorization: "Bearer {{ fleetsim_api_token }}"
            validate_certs: "{{ fleetsim_validate_certs }}"
          loop: "{{ cluster_hosts.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.json | rejectattr('ready') | list | length > 0
          register: incidents
          no_log: true   # the request carries the token

        # As with the repairs: keep only the advisor's replies, never the registered requests.
        - name: Keep only the advisor's replies
          ansible.builtin.set_fact:
            fleetsim_proposals: "{{ incidents.results | default([]) | selectattr('json', 'defined') | map(attribute='json') | list }}"
          no_log: true

        - name: Report the hand-off
          ansible.builtin.debug:
            msg: "handed to the AI advisor: {{ item.cluster }}, proposal {{ item.proposal }}"
          loop: "{{ fleetsim_proposals }}"
          loop_control:
            label: "{{ item.cluster }}"

    - name: Repair by the runbook
      when: fleetsim_remediation == 'runbook'
      block:
        - name: Fail on hosts with no applicable action
          ansible.builtin.fail:
            msg: "No action applies to {{ item.host }} ({{ item.status }})"
          loop: "{{ repairs | default([]) | selectattr('action', 'equalto', '') | list }}"

        - name: Repair each host
          ansible.builtin.include_role:
            name: sim_action
          vars:
            sim_action: "{{ item.action }}"
            sim_action_target: "{{ item.host }}"
          loop: "{{ repairs | default([]) }}"
          loop_control:
            label: "{{ item.action }} {{ item.host }}"
